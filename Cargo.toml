[workspace]
members = [
    "runtime/aac", "runtime/d3d12", "runtime/gamechat", "runtime/gameconfig",
    "runtime/mfreadwrite", "runtime/xaudio", "runtime/xg", "runtime/xmem", "tools/pipeline-prep",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
windows = "0.61.3"
windows-sys = "0.61.2"

[profile.release]
panic = "abort"
